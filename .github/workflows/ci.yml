# Continuous integration: on every push and pull request, check that the API
# builds and its tests pass, and that the frontend builds.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/Concilia.slnx
      - run: dotnet build src/Concilia.slnx --no-restore -c Release
      - run: dotnet test src/Concilia.slnx --no-build -c Release

  # The Python scripts of prompts/generacion_requisitos are the reference of the
  # C# fragmenter and validator: their own tests must keep passing.
  reference-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompts/generacion_requisitos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # jsonschema >= 4.18 brings the draft 2020-12 of JSON Schema.
      - run: pip install "jsonschema>=4.18"
      - run: python test_fragmentar.py
      - run: python test_validador.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
