<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- The logo of the app (src/ui/Logo.tsx). A new file name (and ?v=) makes the
         browser fetch it again instead of showing the icon it has cached. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/logo.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concilia</title>
    <script>
      // The chosen theme before React starts, so the page does not flash
      // light in dark mode (useTheme keeps it up to date afterwards).
      try {
        const saved = JSON.parse(localStorage.getItem('concilia.theme'))
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
