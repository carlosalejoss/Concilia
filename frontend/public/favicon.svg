<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round">
  <!-- The mark of the app (src/ui/Logo.tsx): two sources, model A and model B,
       that meet in one validated line. A thicker stroke so it reads at 16 px. -->
  <style>
    .a { stroke: #2f5da8; }
    .b { stroke: #8a4c9c; }
    .v { stroke: #0e6e5c; }
    @media (prefers-color-scheme: dark) {
      .a { stroke: #7ea2e6; }
      .b { stroke: #c895d6; }
      .v { stroke: #4fc1a6; }
    }
  </style>
  <path class="a" d="M3 5 C 9 5, 9 12, 13 12" />
  <path class="b" d="M3 19 C 9 19, 9 12, 13 12" />
  <path class="v" d="M13 12 H 21" />
</svg>
