# Same idea as the proxy in vite.config.ts: the browser talks only to this
# server, which forwards API routes to the "api" container.
server {
    listen 80;

    # nginx rejects request bodies over 1 MB by default. Allow uploads up to
    # 30 MB, the same default limit as the API (Kestrel). Step 15 sets the
    # final limits.
    client_max_body_size 30m;

    location /health {
        proxy_pass http://api:8080;
    }

    location /projects {
        proxy_pass http://api:8080;
    }

    # Everything else is the React app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
