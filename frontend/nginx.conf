# Same idea as the proxy in vite.config.ts: the browser talks only to this
# server, which forwards API routes to the "api" container.
server {
    listen 80;

    # nginx rejects request bodies over 1 MB by default. The real limit per file
    # (10 MB) is checked by the API, which returns a clear message. This is only
    # a safety ceiling, well above it and equal to the API's own default (30 MB).
    client_max_body_size 30m;

    location /health {
        proxy_pass http://api:8080;
    }

    # Step 122: launching a centred round or an update computes embeddings
    # before answering, which in a big project takes more than the default
    # 60 s, and so do the report and its CSV the first time. Then nginx answered
    # 504 although the task had been launched.
    location /projects {
        proxy_pass http://api:8080;
        proxy_read_timeout 5m;
    }

    location /jobs {
        proxy_pass http://api:8080;
        proxy_read_timeout 5m;
    }

    location /questions {
        proxy_pass http://api:8080;
    }

    location /question-rounds {
        proxy_pass http://api:8080;
    }

    location /embeddings {
        proxy_pass http://api:8080;
    }

    # The documentation of the API: Swagger UI and its OpenAPI document.
    location /swagger {
        proxy_pass http://api:8080;
    }

    location /openapi {
        proxy_pass http://api:8080;
    }

    location /runs {
        proxy_pass http://api:8080;
        # Server-Sent Events: pass each event on at once instead of buffering,
        # and keep the connection open while a run lasts.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Everything else is the React app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
