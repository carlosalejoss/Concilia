# Starts the whole application: database, API and web.
# Usage: copy .env.example to .env, fill in the values and run `docker compose up --build`.
# The web is then available at http://localhost:8080.

# The name of the Compose project, fixed: it names the containers and the
# volume with the data (reqarbiter_db-data). Without it, Compose takes the name
# of the folder, and renaming the folder would start with an empty database.
# It keeps the name the project had before it was called Concilia (13-10-2026).
name: reqarbiter

services:
  db:
    image: postgres:18-alpine
    environment:
      # Database and user keep the first name of the project (ReqArbiter):
      # renaming them would leave the existing data behind.
      POSTGRES_DB: reqarbiter
      POSTGRES_USER: reqarbiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume: the data survives when the containers are recreated.
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqarbiter -d reqarbiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # The context is the repository root, so the build sees src/ and prompts/.
      # .dockerignore keeps .env, data/ and the rest out of it.
      context: .
      dockerfile: src/Concilia.Api/Dockerfile
    image: concilia-api
    environment:
      ConnectionStrings__Default: Host=db;Database=reqarbiter;Username=reqarbiter;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Storage__RootPath: /data
      # Fake (default) or LiteLlm. With LiteLlm the two LITELLM_* variables are required.
      Runner__Provider: ${RUNNER_PROVIDER:-Fake}
      # Models A and B of every job (roles are configuration).
      Runner__ModelA: "${RUNNER_MODEL_A:-SS - GPT-6-SOL}"
      Runner__ModelB: "${RUNNER_MODEL_B:-SS - GPT-6-LUNA}"
      Runner__ModelArbiter: "${RUNNER_MODEL_ARBITER:-SS - GPT-6-SOL}"
      Runner__ModelSuggestions: "${RUNNER_MODEL_SUGGESTIONS:-SS - GPT-6-SOL}"
      # Fake only: "true" makes the first attempt of each lot invalid, to see a repair.
      Runner__SimulateRepair: ${RUNNER_SIMULATE_REPAIR:-false}
      # Output cap per model response, passed to Claude Code (default 64000).
      Runner__MaxOutputTokens: ${RUNNER_MAX_OUTPUT_TOKENS:-64000}
      # The v0 phases read the documentation by parts: turns per run, and the
      # largest documentation (estimated tokens) a phase accepts.
      Runner__PhaseMaxTurns: ${RUNNER_PHASE_MAX_TURNS:-30}
      Runner__MaxDocumentationTokens: ${RUNNER_MAX_DOCUMENTATION_TOKENS:-300000}
      # Only the api service receives the gateway variables.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Mockup: Fake (default), ClaudeSubscription (needs CLAUDE_CODE_OAUTH_TOKEN) or LiteLlm.
      Mockup__Provider: ${MOCKUP_PROVIDER:-Fake}
      Mockup__Model: ${MOCKUP_MODEL:-claude-sonnet-5-5}
      # The author's subscription token: it only reaches the mockup child process.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Uploaded files go to the data/ folder of the repository (ignored by git),
      # so they can be inspected from the host.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    image: concilia-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
